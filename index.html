<script>

/* =========================
   AUDIO
========================= */

const audio =
document.getElementById("bgAudio");

audio.volume = 0.08;

/* =========================
   PASSWORD CHECK
========================= */

function checkPassword(){

const password =
document.getElementById("passwordInput").value;

if(password === "Love"){

document.getElementById("loginScreen")
.style.display = "none";

document.getElementById("mainWebsite")
.style.display = "block";

document.body.style.overflow = "auto";

audio.play();

showCyanButterfly();

}

else{

const error =
document.getElementById("error");

error.style.opacity = "1";

setTimeout(()=>{

error.style.opacity = "0";

},2000);

}

}

/* =========================
   ENTER SUPPORT
========================= */

document
.getElementById("passwordInput")
.addEventListener("keypress", function(event){

if(event.key === "Enter"){
checkPassword();
}

});

/* =========================
   ZINNIA
========================= */

function butterflySecret(){

const msg =
document.getElementById("zinniaMessage");

msg.style.opacity = "1";

setTimeout(()=>{

msg.style.opacity = "0";

},2000);

}

/* =========================
   GLITCH EVENT
========================= */

setInterval(()=>{

const title =
document.getElementById("mainTitle");

title.innerHTML =
"SHE NEVER WANTED THIS END";

createGlassShatter();

setTimeout(()=>{

title.innerHTML =
"THE PROJECTION WORLD<br>IS THE TRUTH";

},800);

},30000);

/* =========================
   GLASS SHATTER
========================= */

function createGlassShatter(){

const glass =
document.getElementById("glassOverlay");

glass.style.opacity = "0.35";

setTimeout(()=>{

glass.style.opacity = "0";

},500);

}

/* =========================
   CYAN BUTTERFLY
========================= */

function showCyanButterfly(){

setTimeout(()=>{

document.querySelector(".cyanButterfly")
.style.opacity = "1";

},15000);

}

/* =========================
   SECRET LOGIN
========================= */

function openSecretLogin(){

document.getElementById("secretLogin")
.style.display = "flex";

}

/* =========================
   SECRET PASSWORD
========================= */

function checkSecretPassword(){

const pass =
document.getElementById("secretPassword").value;

if(pass === "SOUL DRAINING"){

document.getElementById("mainWebsite")
.style.display = "none";

document.getElementById("secretLogin")
.style.display = "none";

document.getElementById("secretPage")
.style.display = "block";

window.scrollTo(0,0);

}

}

/* =========================
   PURPLE BUTTERFLY MORSE
========================= */

const purpleButterfly =
document.querySelector(".butterfly");

/*
DEATH in Morse

D = -..
E = .
A = .-
T = -
H = ....
*/

const morsePattern = [

600,200,200,
800,

200,
800,

200,600,
800,

600,
800,

200,200,200,200

];

/* =========================
   FLASH EFFECT
========================= */

function flashButterfly(duration){

purpleButterfly.style.transition =
"filter 0.05s linear";

purpleButterfly.style.filter =
"brightness(4) drop-shadow(0 0 25px #c6bcff)";

setTimeout(()=>{

purpleButterfly.style.filter =
"brightness(1)";

}, duration);

}

/* =========================
   PLAY MORSE
========================= */

function playMorse(){

let totalDelay = 0;

morsePattern.forEach((time)=>{

setTimeout(()=>{

flashButterfly(time);

}, totalDelay);

totalDelay += time + 120;

});

}

/* =========================
   START MORSE LOOP
========================= */

setTimeout(()=>{

playMorse();

},5000);

setInterval(()=>{

playMorse();

},30000);

</script>
